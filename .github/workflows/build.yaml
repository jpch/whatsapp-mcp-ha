name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: whatsapp_mcp/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: whatsapp_mcp/app/go.mod
          cache-dependency-path: whatsapp_mcp/app/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read add-on version
        id: meta
        run: |
          version=$(grep -E '^version:' whatsapp_mcp/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build image (runs the unit tests in the build)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: whatsapp_mcp
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.24
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            whatsapp-mcp:test
            ghcr.io/jpch/${{ matrix.arch }}-whatsapp-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/jpch/${{ matrix.arch }}-whatsapp-mcp:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/jpch/whatsapp-mcp-ha
          load: true
      - name: Load the add-on AppArmor profile
        id: aa
        run: |
          if [ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)" = "Y" ]; then
            sed 's/^profile whatsapp_mcp /profile ci_whatsapp_mcp /' whatsapp_mcp/apparmor.txt > "$RUNNER_TEMP/aa.txt"
            sudo apparmor_parser -r -W "$RUNNER_TEMP/aa.txt"
            echo "opt=--security-opt apparmor=ci_whatsapp_mcp" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AppArmor is not enabled on this runner; smoke test runs without the profile"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test (never contacts WhatsApp)
        env:
          AA_OPT: ${{ steps.aa.outputs.opt }}
          AA_ENABLED: ${{ steps.aa.outputs.enabled }}
        run: |
          set -eu
          token=$(head -c 32 /dev/urandom | base64 | tr -d '/+=\n')
          send_token=$(head -c 32 /dev/urandom | base64 | tr -d '/+=\n')
          # shellcheck disable=SC2086
          docker run -d --name smoke $AA_OPT -p 127.0.0.1:8120:8120 \
            -e WA_MCP_NO_CONNECT=1 -e WA_MCP_TOKEN="$token" \
            -e WA_MCP_ENABLE_SEND=true -e WA_MCP_SEND_TOKEN="$send_token" whatsapp-mcp:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8120/healthz && break; sleep 1; done
          docker exec smoke uname -m
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8120/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8120/)" = 404
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          curl -fsS -X POST http://127.0.0.1:8120/mcp -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$body" | tee init.json
          grep -q '"whatsapp-mcp"' init.json
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          curl -fsS -X POST http://127.0.0.1:8120/mcp -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-06-18' -d "$list" > tools.json
          # The read-only token never sees the send tools; the send token does.
          ! grep -q '"send_message"' tools.json
          grep -q '"list_chats"' tools.json
          grep -q '"untrusted"' tools.json
          curl -fsS -X POST http://127.0.0.1:8120/mcp -H "Authorization: Bearer $send_token" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-06-18' -d "$list" > send-tools.json
          grep -q '"send_message"' send-tools.json
          grep -q '"list_chats"' send-tools.json
          # Token, data files and the database must not be readable by others; the token never appears in the log.
          test "$(docker exec smoke stat -c %a /data)" = 700
          test "$(docker exec smoke stat -c %a /data/messages.db)" = 600
          test "$(docker exec smoke stat -c %a /data/whatsmeow.db)" = 600
          ! docker logs smoke 2>&1 | grep -qF "$token"
          ! docker logs smoke 2>&1 | grep -qF "$send_token"
          if [ "$AA_ENABLED" = "true" ]; then
            # The server runs in the confined child profile and cannot write outside /data and /share/whatsapp-mcp.
            label=$(docker exec smoke sh -c 'cat /proc/$(pidof whatsapp-mcp)/attr/current')
            echo "server profile: $label"
            echo "$label" | grep -q '^ci_whatsapp_mcp//whatsapp_mcp_server (enforce)'
            if docker exec -e WA_MCP_NO_CONNECT=1 -e WA_MCP_TOKEN="$token" -e WA_MCP_LISTEN=127.0.0.1:18999 \
                 -e WA_MCP_DATA_DIR=/opt/evil smoke timeout 20 /usr/bin/whatsapp-mcp; then
              echo "server wrote outside its allowed folders"; exit 1
            fi
            ! docker exec smoke test -e /opt/evil
          fi
          docker logs smoke 2>&1 | tail -n 20
          docker image inspect whatsapp-mcp:test --format '{{.Architecture}} {{.Size}}'
      - name: Invalid configuration stops the container (exit 2, no restart loop)
        run: |
          set -eu
          docker run -d --name badcfg -e WA_MCP_NO_CONNECT=1 -e WA_MCP_TOKEN=short whatsapp-mcp:test
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Running}}' badcfg)" = false ] && break; sleep 1; done
          code=$(docker inspect -f '{{.State.ExitCode}}' badcfg)
          docker logs badcfg 2>&1 | tail -n 5
          test "$code" = 2
      - name: Publish to ghcr.io (main and tags, only when PUBLISH_IMAGES is set)
        if: vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "ghcr.io/jpch/${ARCH}-whatsapp-mcp:${VERSION}"
          docker push "ghcr.io/jpch/${ARCH}-whatsapp-mcp:latest"
